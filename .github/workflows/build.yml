name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gperf libpng-dev ninja-build
      - name: CE toolchain
        run: sh tools/ce-toolchain.sh "$RUNNER_TEMP/ce-toolchain"
      - name: Build
        run: |
          echo "VERSION=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          make package VERSION="${GITHUB_REF_NAME//\//-}" GRIMACE="$RUNNER_TEMP/ce-toolchain/grimace" GRIMACE_LLVM_ROOT="$RUNNER_TEMP/ce-toolchain/llvm"
      - name: CE imports
        run: make check-imports GRIMACE="$RUNNER_TEMP/ce-toolchain/grimace"
      - name: Source archive
        run: tar --exclude=.git --exclude=./build -czf "build/netsurf-ce-$VERSION-source.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: netsurf-ce-${{ env.VERSION }}
          path: |
            build/netsurf-ce-*.zip
            build/netsurf-ce-*-source.tar.gz
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/netsurf-ce-*.zip
            build/netsurf-ce-*-source.tar.gz
